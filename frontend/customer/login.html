<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — StayLuxe</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/common.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-wrap { min-height: 90vh; display:flex; align-items:center; justify-content:center; background: var(--gradient-soft); padding: 40px 16px; }
  .auth-header { text-align:center; margin-bottom: 26px; }
  .auth-header .icon { font-size: 2.4rem; }
</style>
</head>
<body>

<nav class="navbar">
  <div class="container">
    <a href="index.html" class="logo">🏨 StayLuxe<span class="dot">.</span></a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="form-card">
    <div class="auth-header">
      <div class="icon float">🔑</div>
      <h2>Welcome Back</h2>
      <p style="color:var(--text-muted);">Login to book your next stay</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>
    <p style="text-align:center; margin-top:20px; color:var(--text-muted);">
      New here? <a href="register.html" style="color:var(--primary-dark); font-weight:700;">Create an account</a>
    </p>
  </div>
</div>

<script src="../assets/js/common.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { ok, data } = await apiRequest("/auth/login/customer", { method: "POST", body: { email, password } });
    if (ok && data.success) {
      saveSession(data.token, data.user);
      showToast("Login successful! Redirecting...", "success");
      setTimeout(() => window.location.href = "index.html", 900);
    } else {
      showToast(data.message || "Login failed.", "error");
    }
  });
</script>
</body>
</html>
