<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — StayLuxe</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  body { background: linear-gradient(160deg, #2d2545 0%, #6d28d9 60%, #14b8a6 130%); }
  .auth-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 40px 16px; }
  .auth-header { text-align:center; margin-bottom: 26px; }
  .auth-header .icon { font-size: 2.4rem; }
  .lock-note { font-size:.78rem; color:var(--text-muted); text-align:center; margin-top:16px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="form-card">
    <div class="auth-header">
      <div class="icon float">🛡️</div>
      <h2>Administrator Access</h2>
      <p style="color:var(--text-muted);">Restricted area — authorized personnel only</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Admin Email</label>
        <input type="email" id="email" required placeholder="admin@stayluxe.com">
      </div>
      <div class="form-group">
        <label>Admin Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Secure Login</button>
    </form>
    <p class="lock-note">🔒 This portal is not linked publicly. Access is limited to system administrators.<br>Default seeded credentials are printed by <code>backend/seed.py</code>.</p>
  </div>
</div>

<script src="../assets/js/common.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { ok, data } = await apiRequest("/auth/login/admin", { method: "POST", body: { email, password } });
    if (ok && data.success) {
      saveSession(data.token, data.user);
      showToast("Access granted.", "success");
      setTimeout(() => window.location.href = "dashboard.html", 700);
    } else {
      showToast(data.message || "Access denied.", "error");
    }
  });
</script>
</body>
</html>
