<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Owner Login — StayLuxe</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/common.css">
<style>
  body { background: var(--gradient-soft); }
  .auth-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding: 40px 16px; }
  .auth-header { text-align:center; margin-bottom: 26px; }
  .auth-header .icon { font-size: 2.4rem; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="form-card">
    <div class="auth-header">
      <div class="icon float">🏢</div>
      <h2>Hotel Owner Portal</h2>
      <p style="color:var(--text-muted);">Manage your hotels and bookings</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="owner@example.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn btn-teal btn-block">Login to Dashboard</button>
    </form>
    <p style="text-align:center; margin-top:20px; color:var(--text-muted);">
      New hotel partner? <a href="register.html" style="color:var(--teal-dark); font-weight:700;">Register your property</a>
    </p>
    <p style="text-align:center; margin-top:10px;">
      <a href="../customer/index.html" style="color:var(--text-muted); font-size:.85rem;">&larr; Back to StayLuxe site</a>
    </p>
  </div>
</div>

<script src="../assets/js/common.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { ok, data } = await apiRequest("/auth/login/owner", { method: "POST", body: { email, password } });
    if (ok && data.success) {
      saveSession(data.token, data.user);
      showToast("Welcome back!", "success");
      setTimeout(() => window.location.href = "dashboard.html", 800);
    } else {
      showToast(data.message || "Login failed.", "error");
    }
  });
</script>
</body>
</html>
